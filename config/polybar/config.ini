[colors]
background = #dd1e1e2e
foreground = #cdd6f4
blue = #89b4fa
green = #a6e3a1
red = #f38ba8
yellow = #f9e2af
surface = #313244
muted = #6c7086

[bar/main]
width = 100%
height = 20
bottom = false
background = ${colors.background}
foreground = ${colors.foreground}
border-left-size =  10 
border-right-size =  10  
border-top-size = 5 
border-bottom-size = -5 
border-color = #00000000
radius = 3 
line-size = 0
padding-left = 0
padding-right = 1
font-0 = monospace:size=8;2
module-margin = 1
modules-left = i3
modules-center =
modules-right = wireless battery date tray
wm-restack = i3
enable-struts = true

[module/tray]
type = internal/tray
tray-maxsize = 16
tray-padding = 1

[settings]
screenchange-reload = true
pseudo-transparency = true


[module/i3]
type = internal/i3
pin-workspaces = true
index-sort = true
strip-wsnumbers = false
enable-click = true
enable-scroll = false

format = <label-state>

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.blue}
label-focused-padding = 1

label-unfocused = %name%
label-unfocused-foreground = ${colors.foreground}
label-unfocused-padding = 1

label-visible = %name%
label-visible-foreground = ${colors.blue}
label-visible-padding = 1

label-urgent = %name%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 1


[module/wireless]
type = internal/network
interface = wlp4s0
interval = 5

interface-type = wireless

format-connected = <label-connected>
format-disconnected = <label-disconnected>

label-connected = WLAN %signal%%
label-connected-foreground = ${colors.green}

label-disconnected = WLAN down
label-disconnected-foreground = ${colors.red}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 5
full-at = 99
low-at = 10

format-charging = CHR <label-charging>
format-discharging = BAT <label-discharging>
format-full = BAT FULL

label-charging = %percentage%%
label-discharging = %percentage%%

label-low = BAT LOW %percentage%%
label-low-foreground = ${colors.red}

[module/date]
type = internal/date
interval = 5
time = %Y-%m-%d %H:%M
time-alt = %Y-%m-%d %H:%M:%S
format = <label>
label = %time%
label-foreground = ${colors.yellow}
